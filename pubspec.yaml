name: nebula_client
description: "Nebula - Secure Distributed Cloud Storage on Telegram"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  nebula_core:
    git:
      url: git@github.com:kaabdulaal/nebula-core.git
      ref: feature/CORE-02-ffi-bridge

dependency_overrides:
  # Override for local development - Git will ignore this, CI/CD will use SSH URL above
  nebula_core:
    path: ../nebula_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
