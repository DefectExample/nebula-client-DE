name: Nebula Client Matrix
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-all:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux & Android (на Ubuntu)
          - os: ubuntu-latest
            target: linux-android
            cmd: |
              flutter build linux --release
              flutter build apk --release
          # Windows
          - os: windows-latest
            target: windows
            cmd: flutter build windows --release
          # macOS & iOS
          - os: macos-latest
            target: macos-ios
            cmd: |
              flutter build macos --release
              flutter build ios --release --no-codesign

    steps:
      - uses: actions/checkout@v4

      # 🔑 МАГИЯ: Доступ к приватному ядру
      - name: Setup SSH for Core
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_CORE }}

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Зависимости для Linux
      - name: Install Linux Deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libjsoncpp-dev libsecret-1-dev

      # Зависимости для macOS
      - name: Install macOS Deps
        if: matrix.os == 'macos-latest'
        run: brew install jsoncpp

      - name: Pub Get
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Artifacts
        run: ${{ matrix.cmd }}

      # 📦 Сохраняем результаты (Artifacts)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nebula-build-${{ matrix.target }}
          path: build/**/outputs/**/release/*
