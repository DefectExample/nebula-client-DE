name: Nebula Multi-Platform Build
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-all:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-android
            cmd: |
              flutter build linux --release
              flutter build apk --release
          - os: windows-latest
            target: windows
            cmd: flutter build windows --release
          - os: macos-latest
            target: macos-ios
            cmd: |
              flutter build macos --release
              flutter build ios --release --no-codesign

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        if: matrix.os == 'ubuntu-latest'
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973"

      - name: Setup SSH for Core
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_CORE }}

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Linux Deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Pub Get
        run: flutter pub get

      - name: Build Artifacts
        run: ${{ matrix.cmd }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nebula-build-${{ matrix.target }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/linux/x64/release/bundle/*
            build/windows/x86_64/runner/Release/*
            build/macos/Build/Products/Release/*.app
