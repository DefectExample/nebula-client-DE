name: Release Matrix Build
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup SSH for private core
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_CORE }}
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libglib2.0-dev \
            pkg-config \
            cmake \
            ninja-build \
            clang
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Linux release
        run: flutter build linux --release
      
      - name: Archive Linux build
        run: |
          cd build/linux/x64/release/bundle
          tar -czf nebula-client-linux-x64.tar.gz *
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v3
        with:
          name: nebula-linux-x64
          path: build/linux/x64/release/bundle/nebula-client-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup SSH for private core
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_CORE }}
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Windows release
        run: flutter build windows --release
      
      - name: Archive Windows build
        run: |
          cd build\windows\x64\runner\Release
          7z a nebula-client-windows-x64.zip *
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v3
        with:
          name: nebula-windows-x64
          path: build/windows/x64/runner/Release/nebula-client-windows-x64.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup SSH for private core
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_CORE }}
      
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build Android APK
        run: flutter build apk --release
      
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: nebula-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v3
        with:
          name: nebula-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  create-release:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            nebula-linux-x64/*
            nebula-windows-x64/*
            nebula-android-apk/*
            nebula-android-aab/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
